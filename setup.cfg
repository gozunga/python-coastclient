[metadata]
name = python-coastclient
summary = OpenStackClient plugin for Coast application hosting
description_file = README.rst
author = Gozunga and Coast contributors
home_page = https://github.com/gozunga/python-coastclient
python_requires = >=3.10
license = Apache-2.0
classifier =
    Environment :: OpenStack
    License :: OSI Approved :: Apache Software License
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.12

[files]
packages = coastclient

[entry_points]
openstack.cli.extension =
    coast = coastclient.osc.plugin
openstack.coast.v1 =
    coast_database_set = coastclient.osc.v1.database:SetDatabase
    coast_database_unset = coastclient.osc.v1.database:UnsetDatabase
    coast_database_backup_policy_show = coastclient.osc.v1.database:ShowDatabaseBackupPolicy
    coast_database_backup_policy_set = coastclient.osc.v1.database:SetDatabaseBackupPolicy
    coast_database_backup_create = coastclient.osc.v1.database:CreateDatabaseBackup
    coast_database_backup_list = coastclient.osc.v1.database:ListDatabaseBackup
    coast_database_engine_list = coastclient.osc.v1.database:ListDatabaseEngine
    coast_database_create = coastclient.osc.v1.database:CreateDatabase
    coast_database_list = coastclient.osc.v1.database:ListDatabase
    coast_database_show = coastclient.osc.v1.database:ShowDatabase
    coast_database_delete = coastclient.osc.v1.database:DeleteDatabase
    coast_database_start = coastclient.osc.v1.database:StartDatabase
    coast_database_stop = coastclient.osc.v1.database:StopDatabase
    coast_database_restart = coastclient.osc.v1.database:RestartDatabase
    coast_database_logs = coastclient.osc.v1.database:LogsDatabase
    coast_database_credentials_show = coastclient.osc.v1.database:ShowDatabaseCredentials
    coast_stack_ingress_rule_list = coastclient.osc.v1.ingress:ListIngressRule
    coast_stack_ingress_rule_create = coastclient.osc.v1.ingress:CreateIngressRule
    coast_stack_ingress_rule_delete = coastclient.osc.v1.ingress:DeleteIngressRule
    coast_stack_create = coastclient.osc.v1.stack:CreateStack
    coast_stack_list = coastclient.osc.v1.stack:ListStack
    coast_stack_event_list = coastclient.osc.v1.stack:ListStackEvent
    coast_stack_show = coastclient.osc.v1.stack:ShowStack
    coast_stack_delete = coastclient.osc.v1.stack:DeleteStack
    coast_server_add = coastclient.osc.v1.server:AddServer
    coast_flavor_list = coastclient.osc.v1.flavor:ListFlavor
    coast_server_list = coastclient.osc.v1.server:ListServer
    coast_server_resize = coastclient.osc.v1.server:ResizeServer
    coast_server_remove = coastclient.osc.v1.server:RemoveServer
