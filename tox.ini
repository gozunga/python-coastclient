[tox]
minversion = 4.0
envlist = py3,pep8,docs,genconfig

[testenv]
passenv = COAST_API_REF
install_command = python -m pip install -c {env:UPPER_CONSTRAINTS_FILE:https://releases.openstack.org/constraints/upper/2026.1} {opts} {packages}
deps = -r{toxinidir}/test-requirements.txt
commands = stestr run {posargs}

[testenv:functional]
passenv =
    COAST_ACCEPTANCE_CONFIG
    COAST_ACCEPTANCE_REQUIRED
    OS_CLIENT_CONFIG_FILE
    OS_CLIENT_SECURE_FILE
commands = stestr --test-path ./coastclient/tests/functional run {posargs}

[testenv:pep8]
commands =
    flake8 coastclient setup.py doc/source/conf.py releasenotes/source/conf.py
    bandit -r coastclient -x coastclient/tests
    doc8 README.rst doc/source releasenotes/source

[testenv:docs]
commands =
    sphinx-build -W --keep-going -b html doc/source doc/build/html
    sphinx-build -W --keep-going -b html releasenotes/source releasenotes/build/html

[testenv:genconfig]
commands = python tools/check_config.py

[testenv:releasenotes]
commands = sphinx-build -W --keep-going -b html releasenotes/source releasenotes/build/html

[flake8]
show-source = true
exclude = .tox,.git,build
